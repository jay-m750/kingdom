<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高中物理電路分析工具（機械系申請應用）</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>⚡ 高中物理電路分析工具</h1>
    <p class="site-subtitle">機械系申請學習歷程輔助工具 — 串聯、並聯、混合電路穩態直流分析</p>
  </header>

  <main class="container">

    <!-- ── 機械工程應用場景 ── -->
    <section id="scenarios" class="card" aria-labelledby="scenarios-heading">
      <h2 id="scenarios-heading">🔧 機械工程應用場景</h2>
      <p class="section-desc">選擇預設場景，自動填入電路參數並顯示機械工程概念說明。</p>
      <div class="scenario-select-row">
        <label for="scenario-select">選擇場景：</label>
        <select id="scenario-select" aria-label="機械工程應用場景選擇">
          <option value="">— 不使用場景（手動輸入）—</option>
          <!-- 由 app.js 動態注入 -->
        </select>
      </div>
    </section>

    <!-- ── 電路輸入表單 ── -->
    <section id="circuit-form" class="card" aria-labelledby="form-heading">
      <h2 id="form-heading">📐 電路輸入</h2>

      <div class="form-group">
        <label for="topology">電路類型</label>
        <select id="topology" aria-label="電路類型選擇">
          <option value="series">串聯電路</option>
          <option value="parallel">並聯電路</option>
          <option value="mixed">混合電路（前段串聯＋後段並聯）</option>
        </select>
      </div>

      <div class="form-group">
        <label for="voltage">電壓源 <span class="unit">（V 伏特）</span></label>
        <input
          id="voltage"
          type="number"
          min="0.001"
          step="any"
          placeholder="例如：12"
          aria-label="電壓源數值（伏特）"
        >
      </div>

      <div class="form-group">
        <label>電阻元件 <span class="unit">（Ω 歐姆）</span></label>
        <div id="resistors-container" aria-label="電阻輸入列表">
          <!-- 由 app.js 動態產生 -->
        </div>
        <button type="button" id="add-resistor" class="btn btn-secondary" aria-label="新增一個電阻輸入欄位">
          ＋ 新增電阻
        </button>
        <p class="hint">最少 1 個，最多 10 個電阻</p>
      </div>

      <div class="form-actions">
        <button type="button" id="analyze" class="btn btn-primary" aria-label="開始分析電路">
          ▶ 分析電路
        </button>
        <button type="button" id="export" class="btn btn-export" aria-label="匯出分析報告為 PDF" style="display:none">
          📄 匯出分析報告
        </button>
      </div>
    </section>

    <!-- ── 分析結果 ── -->
    <section id="results" class="card" aria-live="polite" aria-label="電路分析結果">
      <!-- 由 app.js 動態填入 -->
    </section>

    <!-- ── 場景詮釋 ── -->
    <section id="scenario-interpretation" class="card interpretation-card" aria-live="polite" style="display:none">
      <!-- 由 app.js 動態填入 -->
    </section>

  </main>

  <!-- ── 列印專用區塊（僅 @media print 可見） ── -->
  <section id="print-view" class="print-only" aria-hidden="true">
    <!-- 由 app.js 在匯出時填入 -->
  </section>

  <footer class="site-footer no-print">
    <p>本工具為純靜態網頁，所有計算均在瀏覽器本地執行，不上傳任何資料。</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
